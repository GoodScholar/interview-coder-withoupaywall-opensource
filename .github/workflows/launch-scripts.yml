name: Launch script regression tests

on:
  pull_request:
    paths:
      - 'stealth-run.sh'
      - 'stealth-run.bat'
      - 'tests/launch-scripts.test.cjs'
      - '.github/workflows/launch-scripts.yml'
  push:
    branches: [main]
    paths:
      - 'stealth-run.sh'
      - 'stealth-run.bat'
      - 'tests/launch-scripts.test.cjs'
      - '.github/workflows/launch-scripts.yml'

jobs:
  launch-scripts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/launch-scripts.test.cjs
